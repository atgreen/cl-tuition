name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ========================================
  # Fetch dependencies on Linux using ocicl
  # ========================================
  fetch-deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ocicl (Linux)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update
          sudo apt-get install -y sbcl curl jq
          OCICL_URL=$(curl -sL -H "Authorization: token $GH_TOKEN" \
            https://api.github.com/repos/ocicl/ocicl/releases/latest | \
            jq -r '.assets[] | select(.name | endswith("_amd64.deb")) | .browser_download_url')
          curl -sL "$OCICL_URL" -o /tmp/ocicl.deb
          sudo dpkg -i /tmp/ocicl.deb
          ocicl setup > ~/.sbclrc

      - name: Fetch Lisp dependencies
        run: |
          # parse-declarations-1.0 is required by serapeum's subsystems
          # (serapeum/macro-tools, serapeum/iter); ocicl only resolves the
          # main system's :depends-on, so it must be listed explicitly.
          ocicl install bordeaux-threads trivial-channels version-string alexandria serapeum cl-base64 fiveam parse-declarations-1.0
          # ocicl can silently skip a system on a transient registry error
          # (seen with fiveam), which poisons the artifact and fails every
          # downstream job.  Fail loudly here instead.
          for sys in bordeaux-threads trivial-channels alexandria serapeum cl-base64 fiveam parse-declarations; do
            ls -d ocicl/*"$sys"* >/dev/null 2>&1 || { echo "::error::ocicl did not install $sys"; exit 1; }
          done

      - name: Upload ocicl directory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ocicl-deps
          path: ocicl
          retention-days: 1

  # ========================================
  # Build and test on all platforms
  # ========================================
  test:
    needs: fetch-deps
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            deps: "sudo apt-get update && sudo apt-get install -y sbcl"
          - os: macos-latest
            deps: "brew install sbcl"
          - os: windows-latest
            deps: "choco install -y sbcl"

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download ocicl dependencies
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ocicl-deps
          path: ocicl

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        # Use ${{ matrix.deps }} directly (not via an env var) so the shell
        # re-parses operators like &&; `run: $INSTALL_CMD` would pass them as
        # literal arguments (e.g. "apt-get update && ..." -> "update" gets
        # "&&" as an arg -> "The update command takes no arguments").
        run: ${{ matrix.deps }}

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: ${{ matrix.deps }}

      - name: Install deps (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install -y sbcl

      - name: Setup ASDF to find tuition and ocicl deps
        run: |
          # Convert Windows backslashes to forward slashes for ASDF
          WORKSPACE="${GITHUB_WORKSPACE//\\//}"
          echo "(require \"asdf\")" > ~/.sbclrc
          echo "(asdf:initialize-source-registry '(:source-registry :inherit-configuration (:tree \"$WORKSPACE/ocicl\") (:tree \"$WORKSPACE\")))" >> ~/.sbclrc
          cat ~/.sbclrc

      - name: Load tuition
        run: |
          sbcl --non-interactive --eval "(asdf:load-system :tuition)"

      - name: Run unit tests
        run: |
          sbcl --non-interactive \
            --eval "(asdf:load-system :tuition/tests)" \
            --eval "(tuition-tests:run-tests)" \
            --eval "(quit)"

      - name: Run example tests (Linux only)
        if: runner.os == 'Linux'
        run: |
          ./test-examples.sh
